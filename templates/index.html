<!DOCTYPE html>
<html>
<head>
    <title>Medicine Recommendation System</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
        }

        .symptoms {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        label {
            background: #f0f2f5;
            padding: 10px;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🩺 Medicine Recommendation System</h1>

    <p>Select your symptoms:</p>

    <div class="symptoms">

        {% for symptom in symptoms %}

        <label>
            <input type="checkbox"
                   value="{{ symptom }}"
                   class="symptom">

            {{ symptom.replace("_", " ").title() }}

        </label>

        {% endfor %}

    </div>

    <button onclick="predictDisease()">
        Predict Disease
    </button>

    <div id="result"></div>

</div>

<script>

async function predictDisease() {

    const checkboxes =
        document.querySelectorAll(".symptom:checked");

    const symptoms = [];

    checkboxes.forEach(function(checkbox) {
        symptoms.push(checkbox.value);
    });

    if (symptoms.length === 0) {

        document.getElementById("result").innerHTML =
            "⚠️ Please select at least one symptom.";

        return;
    }

    const response = await fetch("/predict", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            symptoms: symptoms
        })

    });

    const data = await response.json();

    if (data.error) {

        document.getElementById("result").innerHTML =
            "⚠️ " + data.error;

    } else {

        document.getElementById("result").innerHTML =
            "Predicted Disease: " + data.disease;

    }

}

</script>

</body>
</html>
